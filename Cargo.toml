[workspace]
resolver = "2"
members = ["crates/core", "crates/media", "crates/render", "crates/export", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
reelforge-core = { path = "crates/core" }
reelforge-media = { path = "crates/media" }
reelforge-render = { path = "crates/render" }
reelforge-export = { path = "crates/export" }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
ffmpeg-next = "9"
eframe = { version = "0.36", features = ["wgpu", "persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.17"
serde_json = "1"
cpal = "0.18"
# Must match the wgpu version egui-wgpu uses, so the app can share eframe's device.
wgpu = "30"
pollster = "0.4"
# Text titles: glyph outlines and rasterising (both already used by egui).
ab_glyph = "0.2"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[profile.dev]
# Decoding and scaling are painfully slow unoptimized; optimize deps even in debug.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
