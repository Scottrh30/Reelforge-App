[workspace]
resolver = "2"
members = ["crates/core", "crates/codecs", "crates/bitstream", "crates/h264", "crates/hevc", "crates/vp9", "crates/av1", "crates/testkit", "crates/media", "crates/render", "crates/export", "crates/engine", "crates/tauri-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
reelforge-core = { path = "crates/core" }
reelforge-codecs = { path = "crates/codecs" }
reelforge-media = { path = "crates/media" }
reelforge-render = { path = "crates/render" }
reelforge-export = { path = "crates/export" }
reelforge-engine = { path = "crates/engine" }

anyhow = "1"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5"
ffmpeg-next = "9"
rfd = "0.17"
serde_json = "1"
cpal = "0.18"
wgpu = "30"
pollster = "0.4"
# Text titles: glyph outlines and rasterising.
ab_glyph = "0.2"
ttf-parser = "0.25"
epaint_default_fonts = "0.36"

[profile.dev]
# Decoding and scaling are painfully slow unoptimized; optimize deps even in debug.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The video decoders are workspace members now, so "*" above no longer covers them:
# their hot loops are far too slow unoptimized (even in tests).
[profile.dev.package.reelforge-codecs]
opt-level = 3

[profile.dev.package.reelforge-bitstream]
opt-level = 3

[profile.dev.package.reelforge-h264]
opt-level = 3

[profile.dev.package.reelforge-hevc]
opt-level = 3

[profile.dev.package.reelforge-vp9]
opt-level = 3

[profile.dev.package.reelforge-av1]
opt-level = 3
