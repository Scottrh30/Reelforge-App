[package]
name = "reelforge-render"
description = "wgpu layer compositor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reelforge-core.workspace = true
wgpu.workspace = true
# Checks plugin shaders (the same compiler wgpu uses, so the version must match wgpu's).
naga = { version = "30.0.1", features = ["wgsl-in"] }
pollster.workspace = true
log.workspace = true
ab_glyph.workspace = true
ttf-parser.workspace = true
epaint_default_fonts.workspace = true
lyon_tessellation = "1.0.23"
# 3D model files.
tobj = "4.0.5"
gltf = { version = "1.4.1", default-features = false, features = ["import", "utils", "names"] }
# Textures for 3D models (OBJ map_Kd).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }
fbxcel = { version = "0.9.0", features = ["tree"] }
openusd = "0.8.0"
stl_io = "0.11.0"

# Zero-copy video: opening the hardware decoder's shared textures in Direct3D 12
# (the same `windows` version wgpu-hal uses).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12"] }

[dev-dependencies]
fbxcel = { version = "0.9.0", features = ["tree", "writer"] }
