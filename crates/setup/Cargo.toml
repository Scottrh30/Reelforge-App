[package]
name = "reelforge-setup"
description = "Finish install: puts the FFmpeg DLLs from the download parts next to reelforge.exe."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "finish-install"
path = "src/main.rs"

[dependencies]
# No FFmpeg here: this runs before the DLLs are in place.
zip = { version = "2", default-features = false, features = ["deflate"] }
crc32fast = "1"
