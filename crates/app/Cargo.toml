[package]
name = "reelforge"
description = "Reelforge video editor (desktop app)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reelforge-core.workspace = true
reelforge-media.workspace = true
reelforge-render.workspace = true
reelforge-export.workspace = true
reelforge-engine.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
rfd.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true
serde.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
# Installing plugins from .zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The format eframe stores settings and the layout in.
ron = "0.12"
