[package]
name = "reelforge-codecs"
description = "Reelforge's own video decoders, in Rust (MJPEG, ProRes, DNxHD/DNxHR, MPEG-2, H.264, HEVC, VP9, AV1). No FFmpeg in here: the media crate feeds them compressed packets."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zune-jpeg = "0.5"
zune-core = "0.5"
reelforge-h264 = { path = "../h264" }
reelforge-hevc = { path = "../hevc" }
reelforge-vp9 = { path = "../vp9" }
reelforge-av1 = { path = "../av1" }
log = { workspace = true }
# The process-wide worker pool, shared with the H.264/HEVC/AV1 decoders.
rayon = "1"
