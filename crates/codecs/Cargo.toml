[package]
name = "reelforge-codecs"
description = "Reelforge's own video decoders, in Rust (MJPEG, ProRes, DNxHD/DNxHR, MPEG-2, H.264, HEVC, VP9, AV1, CineForm, OpenEXR). No FFmpeg in here: the media crate feeds them compressed packets."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zune-jpeg = "0.5"
zune-core = "0.5"
# zlib (OpenEXR ZIP, ZIPS and PXR24).
miniz_oxide = "0.9"
# Zstandard (OpenEXR ZSTD), pure Rust.
ruzstd = "0.9"
# High-Throughput JPEG 2000 (OpenEXR HTJ2K256/HTJ2K32/LJ2K): a safe-Rust port of OpenJPH.
htj2k = "0.1"
reelforge-h264 = { path = "../h264" }
reelforge-hevc = { path = "../hevc" }
reelforge-vp8 = { path = "../vp8" }
reelforge-vp9 = { path = "../vp9" }
reelforge-av1 = { path = "../av1" }
log = { workspace = true }
# The process-wide worker pool, shared with the H.264/HEVC/AV1 decoders.
rayon = "1"
