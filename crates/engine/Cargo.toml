[package]
name = "reelforge-engine"
description = "Reelforge's editor engine without a user interface: the editing model, playback and audio, the viewer picture, caches and safety nets. Used by the app (crates/tauri-app)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Reading SVG logos for 3D shapes (no text, no raster images).
usvg = { version = "0.45", default-features = false }
reelforge-core.workspace = true
reelforge-media.workspace = true
reelforge-render.workspace = true
reelforge-export.workspace = true
# The roto brush's object model.
reelforge-sam.workspace = true
# Saving upscaled pictures.
image = { version = "0.25", default-features = false, features = ["png"] }
jpeg-encoder = "0.7"
# Viewer snapshots.
png = "0.18"
miniz_oxide = "0.9"
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
cpal.workspace = true
crossbeam-channel.workspace = true
# Installing plugins from .zip files.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
