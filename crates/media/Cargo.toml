[package]
name = "reelforge-media"
description = "FFmpeg-backed probing and threaded decoding."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
reelforge-core.workspace = true
reelforge-codecs.workspace = true
ffmpeg-next.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
# Names the shared decode worker pool (see `init`).
rayon = "1"
# Camera RAW: the Blackmagic RAW SDK, opened at run time when installed.
libloading = "0.8"

# Zero-copy video: sharing D3D11VA frames with the compositor.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
