[package]
name = "reelforge-av1"
description = "Clean-room AV1 decoder (AV1 Bitstream & Decoding Process Specification v1.0.0 with Errata 1)"
version = "0.9.0"
edition = "2024"
license.workspace = true

[lints.rust]
unsafe_code = "forbid"

[features]
default = ["threads"]
threads = ["dep:rayon"]

[dependencies]
reelforge-bitstream = { path = "../bitstream" }
thiserror = "2"
rayon = { version = "1", optional = true }

[dev-dependencies]
reelforge-testkit = { path = "../testkit" }

# Thread CPU clock for load-robust performance tests.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time"] }
