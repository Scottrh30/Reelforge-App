# Coverage-guided fuzzing of Reelforge's own decoders (libFuzzer through cargo-fuzz).
# Not part of the main workspace. See README.md here.
[package]
name = "reelforge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reelforge-codecs = { path = "../crates/codecs" }

[lib]
path = "src/lib.rs"

# Its own workspace, so it never joins (or breaks) the main one.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "mjpeg"
path = "fuzz_targets/mjpeg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prores"
path = "fuzz_targets/prores.rs"
test = false
doc = false
